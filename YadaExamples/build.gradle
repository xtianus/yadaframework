buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath 'net.yadaframework:yadatools:0.7.7.R4'
    }
}

plugins {
    id 'application' // for the "run" task
	id 'org.hidetake.ssh' version '2.12.0'
	id 'com.meiuwa.gradle.sass' version "1.0.0"	// Only when using SASS !!! v2.0.0 may not work
	id("com.github.node-gradle.node") version "3.5.1"
}

apply from: '../loadSharedProperties.gradle'

group = 'net.yadaframework'
version = yada_version

ext.acronym = 'yex'
apply plugin: 'war'
apply plugin: 'eclipse-wtp'
apply plugin: 'net.yadaframework.tools'
apply plugin: 'org.hidetake.ssh'        // https://gradle-ssh-plugin.github.io

// Reading the gradle.local.properties file
def yadaSourceRepoPath = null;
def yadaProjects = null;
Properties localProps = new Properties()
File localPropsFile = file('gradle.local.properties')
if(localPropsFile.exists()) {
    localPropsFile.withInputStream { 
        localProps.load(it) 
    }
    yadaSourceRepoPath = localProps.getProperty('yadaSourceRepoPath')
    yadaProjects = localProps.getProperty('yadaProjects')
}

def YadaWebLib = "$projectDir/../YadaWeb";
def YadaWebCmsLib = "$projectDir/../YadaWebCMS";

if (!project.hasProperty('env')) {
	ext.env="envUnset"
}

sassCompile {
    source = project.files(fileTree("src/main/webapp/res/css"), fileTree("$YadaWebLib/src/main/resources/net/yadaframework/views/yada/css"), fileTree("$YadaWebCmsLib/src/main/resources/net/yadaframework/views/yada/css")) 
    include("**/*.sass", "**/*.scss", "**/*.css")
    exclude("**/*.min.*", "**/_*.sass", "**/_*.scss")
    output = file("src/main/webapp/res/css")
}

java {
    sourceCompatibility = JavaVersion.valueOf("VERSION_${java_version}")
    targetCompatibility = JavaVersion.valueOf("VERSION_${java_version}")
	toolchain {
		languageVersion = JavaLanguageVersion.of(java_version)
	}
}

eclipse {
    jdt {
	    sourceCompatibility = JavaVersion.valueOf("VERSION_${java_version}")
	    targetCompatibility = JavaVersion.valueOf("VERSION_${java_version}")
        // https://stackoverflow.com/a/35302104/587641
        file {
                File dir = file('.settings')
                dir.mkdirs()
                File f = file('.settings/org.eclipse.core.resources.prefs')
            if (!f.exists()) {
                    f.write('eclipse.preferences.version=1\n')
                    f.append('encoding/<project>=utf-8')
                }
            }
    }
    wtp {
        component {
        	contextPath = '/'
        }
        // This section edits the file "/.settings/org.eclipse.wst.common.project.facet.core.xml"
        // removing the facet of jst.web version 2.4 and adding version 3.1.
        // One day this will not be needed anymore, but until then...
        facet {
        	facet name: 'jst.web', version: '3.1'
        	def oldJstWebFacet = facets.findAll {
            	it.name == 'jst.web' && it.version == '2.4'
            }
            facets.removeAll(oldJstWebFacet)
        }
    }
	// https://blog.gradle.org/buildship-sync-task-exec
    autoBuildTasks sassCompile // Only when using SASS !!!
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF8'
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add("-parameters")
}

repositories {
    mavenCentral()
    // mavenLocal()
}

dependencies {

	implementation	 project(':YadaWeb')
	implementation	 project(':YadaWebSecurity')
	implementation	 project(':YadaWebCMS')	
	implementation	 project(':YadaWebCommerce')

	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.27'

}

// Tests of the example application (src/test): unit tests with JUnit and Mockito, and tests that boot the real
// configuration in a Spring web test context over src/main/webapp, on the framework embedded MariaDB.
// Versions are aligned with YadaTests and with the Spring Security version of YadaWebSecurity.
ext {
	junitBomVersion = '6.1.3'
	mockitoVersion = '5.24.0'
	springTestVersion = '6.2.19'
	hamcrestVersion = '3.0'
	springSecurityTestVersion = '6.5.11'
	mariaDB4jVersion = '3.3.1'
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "org.mockito:mockito-core:${mockitoVersion}"
	testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
	testImplementation "org.springframework:spring-test:${springTestVersion}"
	// Optional dependency of spring-test, needed by the MockMvc result matchers
	testImplementation "org.hamcrest:hamcrest:${hamcrestVersion}"
	testImplementation "org.springframework.security:spring-security-test:${springSecurityTestVersion}"
	// The embedded database is compileOnly in YadaWeb
	testImplementation("ch.vorburger.mariaDB4j:mariaDB4j:${mariaDB4jVersion}") {
		// mariaDB4j pulls the latest version of spring core but this is never a good thing.
		exclude group: 'org.springframework', module: 'spring-core'
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
	// The test configuration replaces src/main/resources/configuration.xml (see src/test/resources)
	systemProperty 'yada.configurationFile', file('src/test/resources/yex-test-configuration.xml').absolutePath
	// ExampleTestDatabase keeps the embedded database of each test JVM below build/test-db
	def testDatabaseRoot = layout.buildDirectory.dir('test-db').get().asFile
	def testTempDir = layout.buildDirectory.dir('tmp/test-jvm').get().asFile
	systemProperty 'yex.buildDir', layout.buildDirectory.get().asFile.absolutePath
	systemProperty 'java.io.tmpdir', testTempDir.absolutePath
	// Optional run-wide overrides of conf.webapp.test.xml, e.g. -PyexTestSettings=/path/to/settings.xml
	if (project.hasProperty('yexTestSettings')) {
		systemProperty 'yex.test.settingsFile', file(project.property('yexTestSettings')).absolutePath
	}
	maxParallelForks = 1
	doFirst {
		// A test JVM that was killed leaves its database process running: stop only the processes that use our folder
		def folderPrefix = testDatabaseRoot.absolutePath + File.separator
		ProcessHandle.allProcesses().filter { process ->
			process.pid() != ProcessHandle.current().pid() && process.info().commandLine().map { it.contains(folderPrefix) && it.contains('mariadbd') }.orElse(false)
		}.forEach { process ->
			logger.lifecycle("Stopping the leftover test database process ${process.pid()}")
			process.destroy()
			try {
				process.onExit().get(30, java.util.concurrent.TimeUnit.SECONDS)
			} catch (java.util.concurrent.TimeoutException e) {
				process.destroyForcibly()
				process.onExit().get(30, java.util.concurrent.TimeUnit.SECONDS)
			}
		}
		// Every run starts from an empty schema, so that every migration runs
		delete testDatabaseRoot, testTempDir
		testTempDir.mkdirs()
	}
	// Fails a test task that discovers no test at all, as in YadaTests, so a wiring mistake can't pass silently
	def executedTests = 0L
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			executedTests = result.testCount
		}
	}
	doLast {
		boolean filtered = !filter.includePatterns.isEmpty() || !filter.commandLineIncludePatterns.isEmpty()
		if (executedTests == 0 && !filtered) {
			throw new GradleException("${path} discovered no tests")
		}
	}
}

yadaInit {
    projectName = rootProject.name
    acronym = project.acronym
    basePackage = 'net.yadaframework.example'
    dbPasswords = ['dev': 'qwe', 'tst': 'qwe', 'prod': 'qwe']
    envs=['dev', 'tst', 'prod']
        // See YadaTools/src/main/groovy/net/yadaframework/tools/YadaProject.groovy
        // for more configuration options
}

configurations {
    generateSchema {
    		canBeResolved = true
		canBeConsumed = false
	}
}
dependencies {
    generateSchema 'org.apache.logging.log4j:log4j-core:2.26.1'
    generateSchema 'org.glassfish:jakarta.el:5.0.0-M1'
}

task dbSchema(dependsOn: [classes], type: JavaExec) {
	inputs.files (configurations.generateSchema, "$rootDir/src/main/resources/META-INF/persistence.xml") 
	outputs.files "$rootDir/schema/${acronym}.sql" // This must be the same name used in persistence.xml
    classpath = configurations.generateSchema + sourceSets.main.runtimeClasspath
    mainClass = 'net.yadaframework.tools.YadaSchemaGenerator'
    doFirst {
        delete outputs.files
		// Since recently, for autodiscovery of entities to work, 
		// the compiled entities must be in the root folder of the META-INF/persistence.xml file
		// so I copy the META-INF file there:
        copy {
     		from 'src/main/resources/META-INF'
    		into layout.buildDirectory.dir('classes/java/main/META-INF')
        }
    }
    doLast {
        delete "build/classes/java/main/META-INF"
    }
}

sass {
	properties = "$rootDir/sass.properties"
    download {
		version = "1.58.2"
		output = "$rootDir/.sass"
    }
}

