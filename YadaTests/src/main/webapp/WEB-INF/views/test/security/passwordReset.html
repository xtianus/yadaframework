<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/test/fragments/head :: head(title=#{yts.pwdreset.title})}"></head>
<body>
	<h1 th:text="#{yts.pwdreset.title}">Password recovery</h1>
	<!--/* Posted to the framework YadaRegistrationController.yadaPasswordResetPost(), which emails the recovery link */-->
	<form th:action="@{/yadaPasswordResetPost}" th:object="${yadaRegistrationRequest}" method="post" novalidate data-testid="passwordResetForm">
		<label for="email" th:text="#{yts.pwdreset.email}">Email</label>
		<input type="email" id="email" th:field="*{email}">
		<button type="submit" th:text="#{yts.pwdreset.submit}">Send</button>
	</form>
	<div th:replace="~{/test/fragments/scripts :: body}"></div>
</body>
</html>
