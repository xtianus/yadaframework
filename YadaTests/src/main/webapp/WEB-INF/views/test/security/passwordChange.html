<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{/test/fragments/head :: head(title=#{yts.pwdchange.title})}"></head>
<body>
	<h1 th:text="#{yts.pwdchange.title}">New password</h1>
	<!--/* username and token are set by YadaRegistrationController.passwordResetForm(). The form is posted to the framework
		YadaRegistrationController.passwordChangeAfterRequest(), which answers with the notification modal */-->
	<p data-testid="username" th:text="${username}">user@example.com</p>
	<form th:action="@{/passwordChangeAfterRequest}" method="post" novalidate data-testid="passwordChangeForm">
		<input type="hidden" name="username" th:value="${username}">
		<input type="hidden" name="token" th:value="${token}">
		<label for="password" th:text="#{yts.pwdchange.password}">Password</label>
		<input type="password" id="password" name="password">
		<label for="confirmPassword" th:text="#{yts.pwdchange.confirmPassword}">Confirm password</label>
		<input type="password" id="confirmPassword" name="confirmPassword">
		<button type="submit" th:text="#{yts.pwdchange.submit}">Change password</button>
	</form>
	<div th:replace="~{/test/fragments/scripts :: body}"></div>
</body>
</html>
